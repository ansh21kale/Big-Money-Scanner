<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Money Scanner Live</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080c11;
    color:#e6edf3;
    font-family:Arial,sans-serif;
}

header{
    padding:18px;
    background:#111820;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #26303a;
}

h1{
    margin:0 0 5px;
    font-size:22px;
}

small{
    color:#8b949e;
}

.tabs{
    display:flex;
    gap:8px;
    padding:12px;
}

button{
    padding:11px 18px;
    border:0;
    border-radius:8px;
    background:#202a34;
    color:white;
    font-weight:bold;
}

button.active{
    background:#238636;
}

#summary{
    padding:0 12px 5px;
    color:#8b949e;
    font-size:13px;
}

#cards{
    padding:10px 12px;
}

.card{
    background:#111820;
    border:1px solid #29343f;
    border-radius:13px;
    padding:14px;
    margin-bottom:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.symbol{
    font-size:16px;
    font-weight:bold;
}

.score{
    font-size:24px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    margin-top:6px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    background:#202a34;
}

.whale{
    color:#ff7b72;
    background:#35171a;
}

.verybig{
    color:#ffa657;
    background:#332414;
}

.big{
    color:#3fb950;
    background:#132b1b;
}

.watch{
    color:#d29922;
}

.green{
    color:#3fb950;
}

.red{
    color:#f85149;
}

.yellow{
    color:#d29922;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:11px;
}

.metric{
    background:#080c11;
    padding:9px;
    border-radius:8px;
    color:#8b949e;
    font-size:11px;
}

.metric b{
    display:block;
    color:#e6edf3;
    font-size:14px;
    margin-top:3px;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#8b949e;
}
</style>
</head>

<body>

<header>

<h1>💰 Big Money Scanner</h1>

<small id="status">
Connecting to Live Feed...
</small>

</header>

<div class="tabs">

<button id="nifty"
class="active"
onclick="show('NIFTY')">
NIFTY
</button>

<button id="bank"
onclick="show('BANKNIFTY')">
BANKNIFTY
</button>

</div>

<div id="summary">
Scanning live option activity...
</div>

<div id="cards"></div>

<script>

let current = 'NIFTY';

let data = {
    NIFTY:[],
    BANKNIFTY:[]
};


function show(x){

    current = x;

    document
    .querySelectorAll('.tabs button')
    .forEach(
        b => b.classList.remove('active')
    );

    document
    .getElementById(
        x === 'NIFTY' ? 'nifty' : 'bank'
    )
    .classList.add('active');

    render();
}


function money(x){

    const n = Number(x || 0);

    return '₹' + n.toFixed(2) + ' Cr';
}


function labelClass(label){

    if(label === 'WHALE')
        return 'whale';

    if(label === 'VERY BIG MONEY')
        return 'verybig';

    if(label === 'BIG MONEY')
        return 'big';

    return 'watch';
}


function signalClass(signal){

    if(
        signal.includes('SHORT') ||
        signal.includes('UNWIND')
    )
        return 'red';

    if(
        signal.includes('LONG') ||
        signal.includes('COVER')
    )
        return 'green';

    return 'yellow';
}


function render(){

    const cards =
        document.getElementById('cards');

    const rows =
        (data[current] || [])
        .filter(
            x => x.label !== 'NORMAL'
        )
        .slice(0,30);


    document.getElementById('summary')
    .textContent =
        rows.length +
        ' unusual contracts detected';


    if(!rows.length){

        cards.innerHTML =
        '<div class="card empty">' +
        '🔎 No Big Money activity detected yet.<br><br>' +
        'Waiting for live market data...' +
        '</div>';

        return;
    }


    cards.innerHTML = rows.map(x => `

    <div class="card">

        <div class="row">

            <span class="symbol">
                ${x.underlying}
                ${x.strike}
                ${x.side}
            </span>

            <span class="score">
                ${x.score}
            </span>

        </div>


        <span class="badge ${labelClass(x.label)}">
            ${x.label}
        </span>


        <span class="badge ${signalClass(x.signal)}">
            ${x.signal}
        </span>


        <span class="badge ${x.pressure === 'BUY PRESSURE'
            ? 'big'
            : x.pressure === 'SELL PRESSURE'
            ? 'whale'
            : 'watch'}">
            ${x.pressure}
        </span>


        <div class="grid">

            <div class="metric">
                60s Money Flow
                <b>
                    ${money(x.net_flow_60s_cr)}
                </b>
            </div>


            <div class="metric">
                60s Turnover
                <b>
                    ${money(x.turnover_60s_cr)}
                </b>
            </div>


            <div class="metric">
                Volume Spike
                <b>
                    ${x.volume_spike}x
                </b>
            </div>


            <div class="metric">
                OI Change
                <b>
                    ${x.oi_change_pct}%
                </b>
            </div>


            <div class="metric">
                Price Change
                <b>
                    ${x.price_change_pct}%
                </b>
            </div>


            <div class="metric">
                LTP
                <b>
                    ₹${x.ltp}
                </b>
            </div>


            <div class="metric">
                VWAP
                <b>
                    ₹${x.vwap}
                </b>
            </div>


            <div class="metric">
                Bid / Ask
                <b>
                    ₹${x.bid} / ₹${x.ask}
                </b>
            </div>

        </div>

    </div>

    `).join('');
}


async function poll(){

    try{

        const response =
            await fetch(
                '/api/status',
                {
                    cache:'no-store'
                }
            );

        const j =
            await response.json();


        data = {
            NIFTY:
                j.nifty || [],

            BANKNIFTY:
                j.banknifty || []
        };


        let status =
            j.connection?.status ||
            'unknown';


        if(status === 'connected'){

            document
            .getElementById('status')
            .textContent =
                '🟢 LIVE • Upstox V3 connected';

        }else{

            document
            .getElementById('status')
            .textContent =
                '🟠 ' + status;
        }


        render();


    }catch(e){

        document
        .getElementById('status')
        .textContent =
            '🔴 Backend connection error';

    }
}


poll();

setInterval(
    poll,
    3000
);

</script>

</body>
</html>
